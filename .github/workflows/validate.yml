name: Validate FAQ plugin

on:
  push:
    branches:
      - develop-1.3.0
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \)             ! -path './dist/*'             ! -path './.git/*'             -print0 | xargs -0 -n1 php -l

      - name: Validate plugin manifest
        if: matrix.php == '8.1'
        run: php -r '$j=json_decode(file_get_contents("plugin.json"), true); if (!is_array($j) || empty($j["id"]) || empty($j["requires"]["geeklog"])) { exit(1); }'

      - name: Validate archive policy
        if: matrix.php == '8.1'
        run: |
          chmod +x build-dist.sh
          ./build-dist.sh >/dev/null
          test -f dist/faq_1.3.0.zip
          if zipinfo -1 dist/faq_1.3.0.zip | grep -E '(^|/)\.[^/]*($|/)'; then
            exit 1
          fi


      - name: Validate modern editor contract
        if: matrix.php == '8.1'
        run: |
          if grep -R --exclude-dir=dist --exclude-dir=.git --exclude-dir=.github --exclude='ROADMAP.md' --exclude='README.md' -n "editor_generate(" .; then
            echo "Legacy editor_generate dependency found."
            exit 1
          fi
          grep -q 'name="faq_desc"' templates/default/admin/faqedit.thtml
          grep -q 'name="faq_desc"' templates/default/admin/catedit.thtml
          grep -q 'name="faq_desc_edited"' templates/default/admin/faqedit.thtml
          grep -q 'COM_setupAdvancedEditor' admin/index.php
          grep -q 'COM_checkHTML' admin/index.php
          grep -q 'data-mg-picker-url' admin/index.php


      - name: Validate article relation fallback
        if: matrix.php == '8.1'
        run: |
          grep -q 'function plugin_templatesetvars_faq' modern.inc
          grep -q "faq_renderContextual('article'" modern.inc
          grep -q "story_text_no_br" modern.inc
          grep -q "story_introtext" modern.inc
          grep -q "faq-context-block" modern.inc


      - name: Ensure unique plugin callbacks
        if: matrix.php == '8.1'
        run: |
          count=$(grep -R --include='*.php' --include='*.inc' -h "function plugin_getconfigtooltip_faq" . | wc -l | tr -d ' ')
          test "$count" = "1"


      - name: Validate native administration hooks
        if: matrix.php == '8.1'
        run: |
          grep -q 'function plugin_getadminoption_faq' functions.inc
          grep -q 'function plugin_cclabel_faq' functions.inc
