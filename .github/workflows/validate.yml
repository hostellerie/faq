name: Validate FAQ plugin

on:
  push:
    branches:
      - develop-1.3.0
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \)             ! -path './dist/*'             ! -path './.git/*'             -print0 | xargs -0 -n1 php -l

      - name: Validate plugin manifest
        if: matrix.php == '8.1'
        run: php -r '$j=json_decode(file_get_contents("plugin.json"), true); if (!is_array($j) || empty($j["id"]) || empty($j["requires"]["geeklog"])) { exit(1); }'

      - name: Validate archive policy
        if: matrix.php == '8.1'
        run: |
          chmod +x build-dist.sh
          ./build-dist.sh >/dev/null
          test -f dist/faq_1.3.0.zip
          if zipinfo -1 dist/faq_1.3.0.zip | grep -E '(^|/)\.[^/]*($|/)'; then
            exit 1
          fi


      - name: Validate modern editor contract
        if: matrix.php == '8.1'
        run: |
          if grep -R --exclude-dir=dist --exclude-dir=.git --exclude-dir=.github --exclude='ROADMAP.md' --exclude='README.md' -n "editor_generate(" .; then
            echo "Legacy editor_generate dependency found."
            exit 1
          fi
          grep -q 'name="faq_desc"' templates/default/admin/faqedit.thtml
          grep -q 'name="faq_desc"' templates/default/admin/catedit.thtml
          grep -q 'name="faq_desc_edited"' templates/default/admin/faqedit.thtml
          grep -q 'COM_setupAdvancedEditor' admin/index.php
          grep -q 'COM_checkHTML' admin/index.php
          grep -q 'data-mg-picker-url' admin/index.php


      - name: Validate article relation fallback
        if: matrix.php == '8.1'
        run: |
          grep -q 'function plugin_templatesetvars_faq' modern.inc
          grep -q "faq_renderArticleContextual" modern.inc
          grep -q "story_text_no_br" modern.inc
          grep -q "story_introtext" modern.inc
          grep -q "faq-context-block" modern.inc


      - name: Ensure unique plugin callbacks
        if: matrix.php == '8.1'
        run: |
          count=$(grep -R --include='*.php' --include='*.inc' -h "function plugin_getconfigtooltip_faq" . | wc -l | tr -d ' ')
          test "$count" = "1"


      - name: Validate native administration hooks
        if: matrix.php == '8.1'
        run: |
          getadmin_count=$(grep -R --exclude-dir=dist --exclude-dir=.git --include='*.php' --include='*.inc' -h "function plugin_getadminoption_faq" . | wc -l | tr -d ' ')
          cclabel_count=$(grep -R --exclude-dir=dist --exclude-dir=.git --include='*.php' --include='*.inc' -h "function plugin_cclabel_faq" . | wc -l | tr -d ' ')
          test "$getadmin_count" = "1"
          test "$cclabel_count" = "1"
          grep -q 'function plugin_getadminoption_faq' api.inc
          grep -q 'function plugin_cclabel_faq' api.inc


      - name: Validate category association contract
        if: matrix.php == '8.1'
        run: |
          grep -q "faq_category_relations" functions.inc
          grep -q "faq_category_relations" autoinstall.php
          grep -q "faq_category_relations" sql/mysql_install.php
          grep -q "function faq_categoryRelationAdd" relations.inc
          grep -q "function faq_categoryRelationGetForItem" relations.inc
          grep -q "function faq_categoryRelationDeleteForCategory" relations.inc
          grep -q "LANG_FAQ_RELATIONS\['whole_category'\]" admin/relations.php
          grep -q "faq-relation-target-type" public_html/relations-admin.js
          grep -q "faq_category_relations" modern.inc
          grep -q "faq_category_relations" admin/index.php

      - name: Validate association target navigation
        if: matrix.php == '8.1'
        run: |
          grep -q 'function faq_adminItemInfoValue' admin/relations.php
          grep -q "\$_USER\['uid'\]" admin/relations.php
          grep -q 'function faq_adminResolveAssociationTarget' admin/relations.php
          grep -q "plugin_idtourl_" admin/relations.php
          grep -q "resolvedTitle === '' && \\$resolvedUrl !== ''" admin/relations.php
          grep -q "/article.php?story=" admin/relations.php
          grep -q "/staticpages/index.php?page=" admin/relations.php
          if grep -q '>View content<' admin/relations.php; then
            echo "Association listings must not duplicate the public target link below a linked title."
            exit 1
          fi
          grep -q 'faq-admin-form' public_html/faq-admin.css

      - name: Validate core coverage audit contract
        if: matrix.php == '8.1'
        run: |
          grep -q 'function faq_coverageCoreCollection' relations.inc
          grep -q 'function faq_coverageExternalSignals' relations.inc
          grep -q "in_array(\$provider, array('article', 'staticpages', 'topic')" admin/coverage.php
          grep -q "LANG_FAQ_COVERAGE\['external_faq_only'\]" admin/coverage.php
          grep -q "signal_faqpage_jsonld" relations.inc
          grep -q "signal_details_summary" relations.inc

      - name: Validate administration navigation contract
        if: matrix.php == '8.1'
        run: |
          grep -q "plugin-admin-nav__form faq-admin-config-form" functions.inc
          grep -q "plugin-admin-nav__item faq-admin-nav__button" functions.inc
          if grep -n "uk-button.*faq-admin-nav__button\|faq-admin-nav__button.*uk-button" functions.inc; then
            echo "FAQ administration navigation must not depend on UIkit button classes."
            exit 1
          fi
          grep -q "var(--eclipse-primary, #3157d5)" public_html/faq-admin.css
          grep -q "var(--eclipse-link, #2448bd)" public_html/faq-admin.css


      - name: Validate Geeklog Resource asset paths
        if: matrix.php == '8.1'
        run: |
          grep -q "return '/faq/' . ltrim" functions.inc
          if grep -A12 "function faq_assetPath" functions.inc | grep -q "?v="; then
            echo "faq_assetPath must not append a query string; Geeklog 2.2.2 validates the physical resource path."
            exit 1
          fi
